<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tiếng Trung không khó — Luyện thi HSK 4 kỹ năng</title>
  <meta name="description" content="Web luyện thi HSK miễn phí cho người Việt: từ vựng, nghe, nói với AI, đọc, viết chữ Hán theo thứ tự nét, thi thử.">
  <meta name="theme-color" content="#b8322a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='10' fill='%23b8322a'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23fbf6ec' font-family='serif'%3E%E4%B8%AD%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Áp theme sớm để tránh nháy màu
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('ttkk:settings') || '{}');
        var t = s.theme || 'auto';
        if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (s.showPinyin === false) document.documentElement.classList.add('hide-pinyin');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua menu</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Menu chính">
      <a class="brand" href="#/">
        <span class="seal" aria-hidden="true">不难</span>
        <span class="brand-text"><strong>Tiếng Trung</strong><em>không khó</em></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <span class="zh-deco" aria-hidden="true">学而时习之</span>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Mở menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </button>
        <a class="brand brand-mini" href="#/"><span class="seal" aria-hidden="true">不难</span><span class="brand-text"><strong>Tiếng Trung</strong> <em>không khó</em></span></a>
        <div class="topbar-tools">
          <label class="level-pick" title="Cấp HSK đang học">
            <span class="sr-only">Cấp HSK</span>
            <select id="levelSelect" aria-label="Chọn cấp HSK"></select>
          </label>
          <button class="chip-toggle" id="pinyinToggle" aria-pressed="true" title="Bật/tắt pinyin"><span class="zh">拼</span><span class="lbl">Pinyin</span></button>
          <button class="icon-btn" id="themeToggle" aria-label="Đổi giao diện sáng/tối" title="Sáng / tối">
            <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
            <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
          </button>
        </div>
      </header>
      <main id="main" class="main" tabindex="-1">
        <div class="boot"><span class="seal big spin-soft">不难</span><p>Đang tải…</p></div>
      </main>
      <footer class="foot">
        <p>Tiếng Trung không khó · Học miễn phí, tiến độ lưu trên trình duyệt của bạn · <a href="#/settings">Cài đặt</a></p>
      </footer>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem">Trang web cần bật JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
